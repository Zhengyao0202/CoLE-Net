[project]
name = "lapsef-mil"
version = "0.1.0"
description = "Local-to-global evidence modeling for glioma MRI radiogenomics"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "scikit-learn>=1.3"]

[project.scripts]
lapsef-train = "lapsef.train:main"
lapsef-predict = "lapsef.predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lapsef"]

[dependency-groups]
dev = ["pytest>=7"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = []
